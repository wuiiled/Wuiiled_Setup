name: Merge Rules All-in-One

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      TZ: 'Asia/Shanghai'

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: pip install "protobuf>=4.25.1"

    - name: Install Tools (Mihomo & Sing-box)
      run: |
        echo "Downloading latest mihomo binary..."
        m_version=$(curl -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -sL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name)
        if [ -z "$m_version" ] || [ "$m_version" = "null" ]; then
          echo "::error::Failed to fetch mihomo version"
          exit 1
        fi
        curl -fsLo mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/$m_version/mihomo-linux-amd64-$m_version.gz"
        gunzip mihomo.gz && chmod +x mihomo && sudo mv mihomo /usr/local/bin/mihomo

        echo "Downloading latest sing-box 1.14 version (including alpha/pre-release) binary..."
        sb_version=$(curl -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -sL https://api.github.com/repos/SagerNet/sing-box/releases | jq -r '[.[] | select(.tag_name | startswith("v1.14."))] | .[0].tag_name')
        if [ -z "$sb_version" ] || [ "$sb_version" = "null" ]; then
          echo "::error::Failed to fetch sing-box version"
          exit 1
        fi
        sb_version_num=${sb_version#v}
        curl -fsLo sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/$sb_version/sing-box-${sb_version_num}-linux-amd64.tar.gz"
        tar -xzf sing-box.tar.gz
        sudo mv sing-box-${sb_version_num}-linux-amd64/sing-box /usr/local/bin/

    - name: Run Python Builders
      run: |
        export LC_ALL=C
        PYTHONPATH=scripts python3 scripts/main.py

    - name: Notify on failure
      if: failure()
      run: |
        echo "::error::Rule build failed! Check the logs above."

    - name: Deploy to Orphan Branches
      run: |
        # Sanity check: abort deploy if key artifacts are missing/empty to avoid
        # pushing broken rule-sets to subscription branches.
        for f in output/singbox/geosite/geosite-cn.srs output/mihomo/geosite/geosite-cn.txt output/smartdns/geosite/geosite-ad.txt; do
          if [ ! -s "$f" ]; then echo "::error::Missing/empty artifact: $f"; exit 1; fi
        done

        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        deploy_branch() {
          local TARGET=$1
          echo "🚀 Starting deploy process for: $TARGET"
          
          local DEPLOY_DIR=$(mktemp -d)
          cd $DEPLOY_DIR
          git init -q
          git checkout -q --orphan $TARGET
          
          mkdir -p rules
          # 拷贝分类子目录
          cp -a $GITHUB_WORKSPACE/output/$TARGET/geosite rules/ 2>/dev/null || true
          cp -a $GITHUB_WORKSPACE/output/$TARGET/geoip rules/ 2>/dev/null || true
          # 拷贝根目录兼容文件 (如 ad_domain_list.txt 等)
          find $GITHUB_WORKSPACE/output/$TARGET -maxdepth 1 -type f ! -name "README.md" -exec cp {} rules/ \; 2>/dev/null || true
          
          # 直接使用 Python 生成的精美独立 README.md
          if [ -f "$GITHUB_WORKSPACE/output/$TARGET/README.md" ]; then
            cp $GITHUB_WORKSPACE/output/$TARGET/README.md README.md
          fi
          
          git add rules/ README.md
          git commit -q -m "Auto Update $TARGET $(date +"%Y-%m-%d %H:%M")" || true
          case "$TARGET" in
            mihomo|adg|mosdns-x|singbox|smartdns) ;;
            *) echo "Invalid target: $TARGET" && exit 1 ;;
          esac
          git push -f -q https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git $TARGET
          
          echo "✅ Deploy completed for: $TARGET"
        }

        deploy_branch mihomo &
        deploy_branch adg &
        deploy_branch mosdns-x &
        deploy_branch singbox &
        deploy_branch smartdns &
        
        wait

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 0
        keep_minimum_runs: 2
