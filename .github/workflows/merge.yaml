name: Merge Rules All-in-One

on:
  push:
    branches:
      - master
  schedule:
    - cron: '17 22 * * *'   # 06:17 UTC+8 daily (off-peak, after Loyalsoldier & whitelist bot)
  repository_dispatch:
    types: [whitelist-updated]
  workflow_dispatch:

# 定时、push 与上游 dispatch 可能并发; 串行化部署避免并发 force-push
concurrency:
  group: rules-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      TZ: 'Asia/Shanghai'

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Resolve cache key date
      id: date
      run: echo "ymd=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

    # 源"上一次完整拉取"缓存 (按日轮换避免每次 run_id 膨胀)
    - name: Restore upstream source cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: ~/.cache/wuiiled_setup
        key: rule-sources-v2-${{ steps.date.outputs.ymd }}
        restore-keys: |
          rule-sources-v2-

    - name: Install Tools (Mihomo & Sing-box)
      run: |
        echo "Downloading latest mihomo binary..."
        m_version=""
        for i in 1 2 3; do
          m_version=$(curl --retry 3 --retry-delay 2 -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -sL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name 2>/dev/null || true)
          [ -n "$m_version" ] && [ "$m_version" != "null" ] && break
          sleep 2
        done
        if [ -z "$m_version" ] || [ "$m_version" = "null" ]; then
          echo "⚠️ Warning: Failed to query latest mihomo via API, using fallback version"
          m_version="v1.19.32"
        fi
        echo "Using mihomo version: $m_version"
        curl --retry 5 --retry-delay 2 --retry-all-errors -fsLo mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/$m_version/mihomo-linux-amd64-$m_version.gz"
        gunzip -f mihomo.gz && chmod +x mihomo && sudo mv mihomo /usr/local/bin/mihomo

        echo "Downloading latest stable sing-box 1.14 version..."
        sb_version=""
        for i in 1 2 3; do
          sb_version=$(curl --retry 3 --retry-delay 2 -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -sL "https://api.github.com/repos/SagerNet/sing-box/releases?per_page=30" | jq -r '[.[] | select((.tag_name | startswith("v1.14.")) and (.prerelease | not))] | .[0].tag_name' 2>/dev/null || true)
          [ -n "$sb_version" ] && [ "$sb_version" != "null" ] && break
          sleep 2
        done
        if [ -z "$sb_version" ] || [ "$sb_version" = "null" ]; then
          echo "⚠️ Warning: Failed to query stable sing-box v1.14 via API, using fallback version"
          sb_version="v1.14.4"
        fi
        echo "Using sing-box version: $sb_version"
        sb_version_num=${sb_version#v}
        curl --retry 5 --retry-delay 2 --retry-all-errors -fsLo sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/$sb_version/sing-box-${sb_version_num}-linux-amd64.tar.gz"
        tar -xzf sing-box.tar.gz
        sudo mv sing-box-${sb_version_num}-linux-amd64/sing-box /usr/local/bin/

    # 部署门禁: 快速测试层不过即拦截构建与部署
    - name: Fast tests (deploy gate)
      run: |
        pip install -r requirements-dev.txt
        python3 -m pytest tests/ -m "not e2e" -q --tb=short

    - name: Run Python Builders
      run: |
        export LC_ALL=C
        python3 scripts/main.py

    - name: Validate 0-Diff & artifact grammar
      run: |
        export LC_ALL=C
        # push / 手动触发每次强制 0-Diff; 定时构建每周日执行一次上游漂移巡检
        if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%u)" = "7" ]; then
          python3 scripts/diff_tianling.py --fail-on-diff --no-cache
        else
          echo "工作日定时构建: 跳过 0-Diff (每周日及 push/手动触发执行)"
        fi
        python3 scripts/lint_artifacts.py output

    - name: Deploy to Orphan Branches (diff-aware)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        AUTH_B64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
        REPO_URL="https://github.com/${{ github.repository }}.git"

        deploy_branch() {
          local TARGET=$1
          case "$TARGET" in
            mihomo|adg|mosdns-x|singbox|smartdns) ;;
            *) echo "Invalid target: $TARGET" && return 1 ;;
          esac
          echo "🚀 Checking & deploying branch: $TARGET"

          local DEPLOY_DIR=$(mktemp -d)
          mkdir -p "$DEPLOY_DIR/rules"
          cp -a "$GITHUB_WORKSPACE/output/$TARGET/geosite" "$DEPLOY_DIR/rules/" 2>/dev/null || true
          cp -a "$GITHUB_WORKSPACE/output/$TARGET/geoip" "$DEPLOY_DIR/rules/" 2>/dev/null || true
          find "$GITHUB_WORKSPACE/output/$TARGET" -maxdepth 1 -type f ! -name "README.md" -exec cp {} "$DEPLOY_DIR/rules/" \; 2>/dev/null || true
          if [ -f "$GITHUB_WORKSPACE/output/$TARGET/README.md" ]; then
            cp "$GITHUB_WORKSPACE/output/$TARGET/README.md" "$DEPLOY_DIR/README.md"
          fi

          # 内容哈希比对: rules/ 完全一致时跳过推送, 避免无效 commit 与 pack 写压力
          if git ls-remote --exit-code "$REPO_URL" "refs/heads/$TARGET" >/dev/null 2>&1; then
            local OLD_DIR=$(mktemp -d)
            if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_B64" \
                clone -q --depth 1 --branch "$TARGET" "$REPO_URL" "$OLD_DIR" 2>/dev/null; then
              local old_hash="" new_hash=""
              if [ -d "$OLD_DIR/rules" ]; then
                old_hash=$(cd "$OLD_DIR" && find rules -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
              fi
              new_hash=$(cd "$DEPLOY_DIR" && find rules -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
              rm -rf "$OLD_DIR"
              if [ -n "$old_hash" ] && [ "$old_hash" = "$new_hash" ]; then
                echo "⏭️ $TARGET 规则内容零变化 (${new_hash:0:12}), 跳过推送"
                rm -rf "$DEPLOY_DIR"
                return 0
              fi
            else
              rm -rf "$OLD_DIR"
            fi
          fi

          cd "$DEPLOY_DIR" || return 1
          git init -q
          git checkout -q --orphan "$TARGET"
          git add rules/
          if [ -f README.md ]; then git add README.md; fi
          git commit -q -m "Auto Update $TARGET $(date +"%Y-%m-%d %H:%M")" || true
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_B64" \
              push -f -q "$REPO_URL" "$TARGET"; then
            echo "❌ Deploy FAILED for: $TARGET"
            rm -rf "$DEPLOY_DIR"
            return 1
          fi
          rm -rf "$DEPLOY_DIR"
          echo "✅ Deploy completed for: $TARGET"
        }

        fail=0
        for TARGET in mihomo adg mosdns-x singbox smartdns; do
          ok=0
          for attempt in 1 2 3; do
            if deploy_branch "$TARGET"; then ok=1; break; fi
            if [ "$attempt" -lt 3 ]; then
              echo "⚠️ $TARGET 第 $attempt 次部署失败, 15s 后重试..."
              sleep 15
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Deploy failed after 3 attempts: $TARGET"
            fail=1
          fi
        done
        if [ "$fail" -ne 0 ]; then
          echo "::error::One or more branch deploys failed; subscription branches may be stale."
          exit 1
        fi

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        workflow_name: Merge Rules All-in-One
        retain_days: 14
        keep_minimum_runs: 10
